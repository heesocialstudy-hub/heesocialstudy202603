         <label data-template-id="planning-stage-label" class="canva-text font-bold block mb-2" for="planning-stage"></label> <select id="planning-stage" class="w-full rounded-xl border border-[#cbded8] bg-white px-4 py-3" aria-describedby="planning-stage-help"> <option value="child">유소년기</option><option value="youth">청년기</option><option value="middle">중장년기</option><option value="senior">노년기</option> </select>
         <p id="planning-stage-help" data-template-id="planning-stage-help" class="canva-text mt-3 leading-relaxed"></p>
         <fieldset class="mt-5">
          <legend data-template-id="planning-event-label" class="canva-text font-bold mb-2"></legend>
          <div class="grid gap-2">
           <label class="flex items-center gap-2 rounded-lg bg-white px-3 py-2"><input type="checkbox" name="planning-event" value="education"> <span data-template-id="planning-event-education" class="canva-text"></span></label> <label class="flex items-center gap-2 rounded-lg bg-white px-3 py-2"><input type="checkbox" name="planning-event" value="housing"> <span data-template-id="planning-event-housing" class="canva-text"></span></label> <label class="flex items-center gap-2 rounded-lg bg-white px-3 py-2"><input type="checkbox" name="planning-event" value="family"> <span data-template-id="planning-event-family" class="canva-text"></span></label> <label class="flex items-center gap-2 rounded-lg bg-white px-3 py-2"><input type="checkbox" name="planning-event" value="health"> <span data-template-id="planning-event-health" class="canva-text"></span></label> <label class="flex items-center gap-2 rounded-lg bg-white px-3 py-2"><input type="checkbox" name="planning-event" value="allowance"> <span data-template-id="planning-event-allowance" class="canva-text"></span></label> <label class="flex items-center gap-2 rounded-lg bg-white px-3 py-2"><input type="checkbox" name="planning-event" value="hobby"> <span data-template-id="planning-event-hobby" class="canva-text"></span></label>
          </div>
         </fieldset>
        </div>
        <div data-template-id="planning-input-card" class="canva-card rounded-2xl p-5">
         <p data-template-id="planning-input-title" class="canva-text font-bold mb-4"></p>
         <div class="grid sm:grid-cols-2 gap-4">
          <div><label data-template-id="planning-income-label" class="canva-text font-semibold block mb-2" for="planning-income"></label><input id="planning-income" type="number" min="0" step="10" inputmode="numeric" class="w-full rounded-xl border border-[#cbded8] px-4 py-3" placeholder="0">
          </div>
          <div><label data-template-id="planning-spending-label" class="canva-text font-semibold block mb-2" for="planning-spending"></label><input id="planning-spending" type="number" min="0" step="10" inputmode="numeric" class="w-full rounded-xl border border-[#cbded8] px-4 py-3" placeholder="0">
          </div>
         </div><label data-template-id="planning-note-label" class="canva-text font-semibold block mt-4 mb-2" for="planning-note"></label> <textarea id="planning-note" rows="3" class="w-full rounded-xl border border-[#cbded8] px-4 py-3 resize-y"></textarea> <button id="planning-save" data-template-id="planning-save" type="button" class="canva-button mt-4 rounded-xl px-5 py-3 font-bold"></button>
         <div id="planning-summary" data-template-id="planning-summary" class="canva-card hidden-panel mt-5 rounded-xl p-4" aria-live="polite"></div>
        </div>
       </div>
       <div id="planning-chart-card" class="hidden-panel mt-6 rounded-2xl bg-white p-5 sm:p-6" aria-live="polite">
        <h3 data-template-id="planning-chart-title" class="canva-text text-center font-bold"></h3>
        <div class="overflow-x-auto mt-3">
         <svg id="planning-line-chart" class="completion-line-chart" viewbox="0 0 980 360" role="img" aria-label="나의 설계안 소득과 소비 꺾은선 그래프"></svg>
        </div>
        <div class="chart-legend">
         <span><i style="background:#148c82"></i><span data-template-id="planning-income-legend" class="canva-text"></span></span><span><i style="background:#f47c48"></i><span data-template-id="planning-spending-legend" class="canva-text"></span></span>
        </div>
       </div>
      </div>
     </section>
    </div>
   </main>
   <footer class="w-full px-4 sm:px-6 lg:px-8 pb-7">
    <div data-template-id="footer-note" class="canva-footer max-w-7xl mx-auto rounded-2xl px-5 py-4 flex items-start gap-3">
     <i data-lucide="info" class="shrink-0 mt-0.5" aria-hidden="true"></i>
     <p data-template-id="footer-text" class="canva-text leading-relaxed"></p>
    </div>
   </footer>
  </div>
  <script>
    const stages = ["child", "youth", "middle", "senior"];
    const stageNames = ["유소년기", "청년기", "중장년기", "노년기"];
    const completed = new Set();
    const completedValues = {};
    let activeIndex = 0;
    let completionReady = false;

    function canAdvanceTo(index) {
      const allowed = index <= activeIndex || (index === activeIndex + 1 && completed.has(stages[activeIndex]));
      if (!allowed && index === activeIndex + 1) {
        navigationWarning.classList.remove("hidden-panel");
        window.setTimeout(() => navigationWarning.classList.add("hidden-panel"), 3200);
      }
      return allowed;
    }

    const tabs = [...document.querySelectorAll("[data-stage]")];
    const panels = [...document.querySelectorAll("[data-stage-panel]")];
    const previousButton = document.getElementById("previous-button");
    const nextButton = document.getElementById("next-button");
    const completionPanel = document.getElementById("completion-panel");
    const learningArea = document.getElementById("learning-area");
    const activityNavigation = document.getElementById("activity-navigation");
    const stageSelector = document.getElementById("stage-selector");
    const planningPanel = document.getElementById("planning-panel");
    const planningStartButton = document.getElementById("planning-start-button");
    const navigationWarning = document.getElementById("navigation-warning");

    function formatMoney(value) {
      return Number.isInteger(value) ? `${value}만 원` : `${value.toFixed(1)}만 원`;
    }

    function updateGraph(panel) {
      const stage = panel.dataset.stagePanel;
      const max = Number(panel.dataset.max);
      const income = Number(panel.querySelector(".income-slider").value);
      const spending = Number(panel.querySelector(".spending-slider").value);

      panel.querySelector(".income-bar").style.height = `${Math.max(1, income / max * 100)}%`;
      panel.querySelector(".spending-bar").style.height = `${Math.max(1, spending / max * 100)}%`;
      panel.querySelector(".income-graph-value").textContent = formatMoney(income);
      panel.querySelector(".spending-graph-value").textContent = formatMoney(spending);
      document.getElementById(`income-output-${stage}`).textContent = formatMoney(income);
      document.getElementById(`spending-output-${stage}`).textContent = formatMoney(spending);
      panel.querySelector(".graph-surface").setAttribute(
        "aria-label",
        `최대 ${formatMoney(max)} 기준, 소득 ${formatMoney(income)}, 소비 ${formatMoney(spending)} 막대그래프`
      );
    }

    function resetPanel(panel) {
      panel.querySelector(".income-slider").value = panel.dataset.startIncome;
      panel.querySelector(".spending-slider").value = panel.dataset.startSpending;
      panel.querySelectorAll("input, .check-button").forEach(control => control.disabled = false);
      panel.querySelectorAll(".feedback").forEach(feedback => feedback.classList.remove("is-visible"));
      updateGraph(panel);
    }

    function showStage(index, moveFocus = false) {
      const targetIndex = Math.max(0, Math.min(stages.length - 1, index));
      if (targetIndex > activeIndex && !canAdvanceTo(targetIndex)) {
        return;
      }
      activeIndex = targetIndex;
      const activeStage = stages[activeIndex];

      tabs.forEach(tab => {
        const active = tab.dataset.stage === activeStage;
        tab.classList.toggle("is-active", active);
        tab.setAttribute("aria-selected", String(active));
        tab.tabIndex = active ? 0 : -1;
      });
      panels.forEach(panel => {
        panel.classList.toggle("hidden-panel", panel.dataset.stagePanel !== activeStage);
      });

      previousButton.disabled = activeIndex === 0;
      nextButton.disabled = activeIndex === stages.length - 1 && !completed.has(activeStage);

      if (moveFocus) {
        tabs[activeIndex].focus();
        learningArea.scrollIntoView({ behavior:"smooth", block:"start" });
      }
    }

    function svgNode(name, attributes = {}, text = "") {
      const node = document.createElementNS("http://www.w3.org/2000/svg", name);
      Object.entries(attributes).forEach(([key, value]) => node.setAttribute(key, value));
      if (text) node.textContent = text;
      return node;
    }

    function drawCompletionChart() {
      const svg = document.getElementById("completion-line-chart");
      if (!svg || stages.some(stage => !completedValues[stage])) return;

      while (svg.lastChild && svg.lastChild.tagName !== "title") {
        svg.removeChild(svg.lastChild);
      }

      const xPositions = [120, 310, 500, 690];
      const chartTop = 38;
      const chartBottom = 285;
      const maxValue = 500;
      const y = value => chartBottom - (value / maxValue) * (chartBottom - chartTop);
      const ticks = [0, 100, 200, 300, 400, 500];

      ticks.forEach(value => {
        const tickY = y(value);
        svg.appendChild(svgNode("line", {
          x1:75, x2:745, y1:tickY, y2:tickY, class:"chart-grid-line"
        }));
        svg.appendChild(svgNode("text", {
          x:58, y:tickY + 4, "text-anchor":"end", class:"chart-axis-label"
        }, String(value)));
      });

      svg.appendChild(svgNode("line", { x1:75, x2:75, y1:chartTop, y2:chartBottom, class:"chart-axis" }));
      svg.appendChild(svgNode("line", { x1:75, x2:745, y1:chartBottom, y2:chartBottom, class:"chart-axis" }));
      svg.appendChild(svgNode("text", { x:20, y:24, class:"chart-axis-label" }, "단위: 만 원"));

      const incomePoints = stages.map((stage, i) => `${xPositions[i]},${y(completedValues[stage].income)}`).join(" ");
      const spendingPoints = stages.map((stage, i) => `${xPositions[i]},${y(completedValues[stage].spending)}`).join(" ");

      svg.appendChild(svgNode("polyline", {
        points:incomePoints, stroke:"#148c82", class:"chart-line"
      }));
      svg.appendChild(svgNode("polyline", {
        points:spendingPoints, stroke:"#f47c48", class:"chart-line"
      }));

      stages.forEach((stage, i) => {
        const income = completedValues[stage].income;
        const spending = completedValues[stage].spending;
        const incomeY = y(income);
        const spendingY = y(spending);

        svg.appendChild(svgNode("circle", {
          cx:xPositions[i], cy:incomeY, r:7, fill:"#148c82", class:"chart-point"
        }));
        svg.appendChild(svgNode("circle", {
          cx:xPositions[i], cy:spendingY, r:7, fill:"#f47c48", class:"chart-point"
        }));

        const closePoints = Math.abs(incomeY - spendingY) < 28;
        svg.appendChild(svgNode("text", {
          x:xPositions[i],
          y:incomeY - (closePoints ? 12 : 13),
          "text-anchor":"middle",
          class:"chart-value-label",
          fill:"#0d746b"
        }, formatMoney(income)));
        svg.appendChild(svgNode("text", {
          x:xPositions[i],
          y:spendingY + (closePoints ? 24 : 22),
          "text-anchor":"middle",
          class:"chart-value-label",
          fill:"#c95639"
        }, formatMoney(spending)));
        svg.appendChild(svgNode("text", {
          x:xPositions[i], y:324, "text-anchor":"middle", class:"chart-stage-label"
        }, stageNames[i]));
      });

      svg.setAttribute(
        "aria-label",
        stages.map((stage, i) =>
          `${stageNames[i]} 소득 ${formatMoney(completedValues[stage].income)}, 소비 ${formatMoney(completedValues[stage].spending)}`
        ).join(". ")
      );
    }

    function updateProgress() {
      const count = completed.size;
      document.getElementById("progress-text").textContent = `${count} / 4`;
      document.getElementById("progress-fill").style.width = `${count / 4 * 100}%`;
      tabs.forEach(tab => tab.classList.toggle("is-complete", completed.has(tab.dataset.stage)));
      nextButton.disabled = activeIndex === stages.length - 1 && !completed.has(stages[activeIndex]);

      const allComplete = completionReady && count === stages.length && stages.every(stage => completedValues[stage]);
      completionPanel.classList.toggle("hidden-panel", !allComplete);
      learningArea.classList.toggle("hidden-panel", allComplete);
      activityNavigation.classList.toggle("hidden-panel", allComplete);
      stageSelector.classList.toggle("hidden-panel", allComplete);

      if (allComplete) {
        requestAnimationFrame(() => {
          drawCompletionChart();
          completionPanel.scrollIntoView({ behavior:"smooth", block:"start" });
        });
      }
    }

    tabs.forEach((tab, index) => {
      tab.addEventListener("click", () => showStage(index));
      tab.addEventListener("keydown", event => {
        if (event.key === "ArrowRight" || event.key === "ArrowDown") {
          event.preventDefault();
          showStage((index + 1) % stages.length, true);
        } else if (event.key === "ArrowLeft" || event.key === "ArrowUp") {
          event.preventDefault();
          showStage((index - 1 + stages.length) % stages.length, true);
        } else if (event.key === "Home") {
          event.preventDefault();
          showStage(0, true);
        } else if (event.key === "End") {
          event.preventDefault();
          showStage(stages.length - 1, true);
        }
      });
    });

    panels.forEach(panel => {
      const incomeSlider = panel.querySelector(".income-slider");
      const spendingSlider = panel.querySelector(".spending-slider");
      const checkButton = panel.querySelector(".check-button");
      const correctFeedback = panel.querySelector('[data-feedback="correct"]');
      const wrongFeedback = panel.querySelector('[data-feedback="wrong"]');

      [incomeSlider, spendingSlider].forEach(slider => {
        slider.addEventListener("input", () => {
          wrongFeedback.classList.remove("is-visible");
          navigationWarning.classList.add("hidden-panel");
          updateGraph(panel);
        });
      });

      checkButton.addEventListener("click", () => {
        const income = Number(incomeSlider.value);
        const spending = Number(spendingSlider.value);
        const answerIncome = Number(panel.dataset.answerIncome);
        const answerSpending = Number(panel.dataset.answerSpending);
        const tolerance = Number(panel.dataset.step);

        correctFeedback.classList.remove("is-visible");
        wrongFeedback.classList.remove("is-visible");

        if (
          Math.abs(income - answerIncome) <= tolerance &&
          Math.abs(spending - answerSpending) <= tolerance
        ) {
          correctFeedback.classList.add("is-visible");
          panel.querySelectorAll("input, .check-button").forEach(control => control.disabled = true);
          completed.add(panel.dataset.stagePanel);
          completedValues[panel.dataset.stagePanel] = { income, spending };
          updateProgress();
        } else {
          wrongFeedback.classList.add("is-visible");
        }
      });

      resetPanel(panel);
    });

    previousButton.addEventListener("click", () => showStage(activeIndex - 1, true));
    nextButton.addEventListener("click", () => {
      if (activeIndex === stages.length - 1 && completed.has(stages[activeIndex])) {
        completionReady = true;
        updateProgress();
        return;
      }
      showStage(activeIndex + 1, true);
    });

    planningStartButton.addEventListener("click", () => {
      completionPanel.classList.add("hidden-panel");
      planningPanel.classList.remove("hidden-panel");
      planningPanel.scrollIntoView({ behavior:"smooth", block:"start" });
    });

    const planningValues = {};

    function resetPlanningInputs() {
      document.querySelectorAll('input[name="planning-event"]').forEach(input => input.checked = false);
      document.getElementById("planning-income").value = "";
      document.getElementById("planning-spending").value = "";
      document.getElementById("planning-note").value = "";
      document.getElementById("planning-summary").classList.add("hidden-panel");
    }

    function drawPlanningChart() {
      const entries = stages.filter(stage => planningValues[stage]);
      const chartCard = document.getElementById("planning-chart-card");
      const svg = document.getElementById("planning-line-chart");
      if (!entries.length) {
        chartCard.classList.add("hidden-panel");
        return;
      }
      while (svg.firstChild) svg.removeChild(svg.firstChild);
      const x = entries.map((stage, index) => 110 + index * (680 / Math.max(1, entries.length - 1)));
      const max = Math.max(500, ...entries.flatMap(stage => [planningValues[stage].income, planningValues[stage].spending]), 100);
      const y = value => 230 - (value / max) * 170;
      [0, max / 2, max].forEach(value => {
        const lineY = y(value);
        svg.appendChild(svgNode("line", { x1:90, x2:820, y1:lineY, y2:lineY, class:"chart-grid-line" }));
        svg.appendChild(svgNode("text", { x:55, y:lineY + 4, "text-anchor":"end", class:"chart-axis-label" }, formatMoney(Math.round(value))));
      });
      svg.appendChild(svgNode("line", { x1:90, x2:90, y1:60, y2:230, class:"chart-axis" }));
      svg.appendChild(svgNode("line", { x1:90, x2:820, y1:230, y2:230, class:"chart-axis" }));
      [["income", "#148c82"], ["spending", "#f47c48"]].forEach(([key, color]) => {
        const points = entries.map((stage, index) => `${x[index]},${y(planningValues[stage][key])}`).join(" ");
        svg.appendChild(svgNode("polyline", { points, stroke:color, class:"chart-line" }));
        entries.forEach((stage, index) => {
          const value = planningValues[stage][key];
          svg.appendChild(svgNode("circle", { cx:x[index], cy:y(value), r:7, fill:color, class:"chart-point" }));
          svg.appendChild(svgNode("text", { x:x[index], y:y(value) - 14, "text-anchor":"middle", class:"chart-value-label", fill:color }, formatMoney(value)));
        });
      });
      entries.forEach((stage, index) => svg.appendChild(svgNode("text", { x:x[index], y:268, "text-anchor":"middle", class:"chart-stage-label" }, stageNames[stages.indexOf(stage)])));
      chartCard.classList.remove("hidden-panel");
    }

    document.getElementById("planning-stage").addEventListener("change", resetPlanningInputs);

    document.getElementById("planning-save").addEventListener("click", () => {
      const stage = document.getElementById("planning-stage").value;
      const events = [...document.querySelectorAll('input[name="planning-event"]:checked')].map(input => input.nextElementSibling.textContent.trim());
      const income = Number(document.getElementById("planning-income").value) || 0;
      const spending = Number(document.getElementById("planning-spending").value) || 0;
      const note = document.getElementById("planning-note").value.trim();
      planningValues[stage] = { income, spending };
      const summary = document.getElementById("planning-summary");
      summary.innerHTML = `<strong>${stageNames[stages.indexOf(stage)]} 설계안</strong><br>선택 이벤트: ${events.length ? events.join(", ") : "없음"}<br>월 소득 ${formatMoney(income)} · 월 소비 ${formatMoney(spending)} · 예상 여유 ${formatMoney(income - spending)}${note ? `<br>메모: ${note}` : ""}`;
      summary.classList.remove("hidden-panel");
      drawPlanningChart();
    });

    document.getElementById("reset-button").addEventListener("click", () => {
      completed.clear();
      completionReady = false;
      Object.keys(completedValues).forEach(key => delete completedValues[key]);
      panels.forEach(resetPanel);
      Object.keys(planningValues).forEach(key => delete planningValues[key]);
      resetPlanningInputs();
      document.getElementById("planning-chart-card").classList.add("hidden-panel");
      updateProgress();
      showStage(0);
      document.querySelector("header").scrollIntoView({ behavior:"smooth", block:"start" });
    });

    showStage(0);
    updateProgress();
    lucide.createIcons();
  </script>
